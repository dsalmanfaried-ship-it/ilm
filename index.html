<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة العلم الشرعي</title>
<style>
:root{--bg:#0f1f1a;--card:#17302a;--card2:#1e3d35;--gold:#d9b86c;--txt:#f1ede2;--mut:#9fb5ad;--ok:#5fcf8f}
*{box-sizing:border-box;margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body{background:var(--bg);color:var(--txt);padding:14px 14px 60px;max-width:760px;margin:auto}
h1{font-size:21px;color:var(--gold)}h2{font-size:17px;margin:14px 0 8px;color:var(--gold)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.head h1{flex:1}
button,.btn{cursor:pointer;border:1px solid #2c5247;background:var(--card2);color:var(--txt);padding:9px 13px;border-radius:10px;font-size:14px}
.gold{background:var(--gold);color:#1b1b1b;border-color:var(--gold);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.sch{display:flex;align-items:center;gap:12px;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1b1b1b;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.nm{flex:1;font-size:17px;font-weight:600}.cnt{font-size:12px;color:var(--mut);font-weight:400;display:block;margin-top:3px}
.bar{height:5px;background:#0f1f1a;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sec{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sec>summary{padding:13px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.sec>summary span{font-size:12px;color:var(--mut);font-weight:400}
.vid{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #214038}
.vid.cur{background:var(--card2)}
.vt{flex:1;cursor:pointer;font-size:15px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #3d6a5d;display:grid;place-items:center;font-size:15px;flex:none;background:none;padding:0;color:transparent}
.vid.done .chk{background:var(--ok);border-color:var(--ok);color:#10281d}
.vid.done .vt{color:var(--mut)}
.del{background:none;border:0;color:var(--mut);padding:4px}
#player{position:relative;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px;display:none}
#player>div,#player iframe{position:absolute;inset:0;width:100%;height:100%}
.empty{color:var(--mut);text-align:center;padding:26px 0;line-height:1.8}
form{display:grid;gap:10px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2c5247;background:var(--bg);color:var(--txt);font-size:15px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#10281d;padding:10px 18px;border-radius:20px;font-weight:600;display:none}
textarea{width:100%;height:160px;border-radius:10px;background:var(--bg);color:var(--txt);border:1px solid #2c5247;padding:10px;direction:ltr;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ===== التخزين ===== */
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let watched=ls.get("watched",{});      // {key:true}
let extras=ls.get("extras",{});        // {scholarName:[{title,videos:[...]}]}  إضافات المستخدم على جهازه
const $=s=>document.querySelector(s);
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};

/* ===== بيانات ===== */
function parse(url){
  url=(url||"").trim();
  let m=url.match(/[?&]list=([\w-]+)/);
  const v=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(v&&!/playlist\?/.test(url))return{kind:"v",id:v[1],key:"v:"+v[1]};
  if(m)return{kind:"p",id:m[1],key:"p:"+m[1]};
  return null;
}
function sectionsOf(name){
  const base=(DATA.scholars.find(s=>s.name===name)||{sections:[]}).sections.map(s=>({title:s.title,videos:s.videos.map(v=>({...v,mine:false}))}));
  (extras[name]||[]).forEach(e=>{
    let sec=base.find(b=>b.title===e.title);
    if(!sec){sec={title:e.title,videos:[]};base.push(sec)}
    e.videos.forEach(v=>sec.videos.push({...v,mine:true}));
  });
  return base;
}
const allVids=n=>sectionsOf(n).flatMap(s=>s.videos).map(v=>({...v,p:parse(v.url)})).filter(v=>v.p);
const stats=n=>{const a=allVids(n);return{total:a.length,done:a.filter(v=>watched[v.p.key]).length}};

/* ===== العرض ===== */
let view={page:"home"},player=null,cur=null,timer=null;
function render(){
  if(player){try{player.destroy()}catch(e){}player=null;clearInterval(timer)}
  const A=$("#app");
  if(view.page==="home")return home(A);
  if(view.page==="scholar")return scholar(A);
  if(view.page==="add")return addPage(A);
  if(view.page==="export")return exportPage(A);
}
function home(A){
  A.innerHTML=`<div class="head"><h1>📚 منصة العلم الشرعي</h1><button onclick="go('add')">＋ إضافة</button></div>`+
  DATA.scholars.map(s=>{const t=stats(s.name),pc=t.total?Math.round(t.done/t.total*100):0;
    return `<div class="card"><div class="sch" onclick="go('scholar','${s.name}')"><div class="av">${s.name.replace(/^(دكتور|الشيخ) /,"")[0]}</div>
    <div class="nm">${s.name}<span class="cnt">${t.total?`شاهدت ${t.done} من ${t.total}`:"لسه مفيش فيديوهات"}</span></div></div>
    ${t.total?`<div class="bar"><i style="width:${pc}%"></i></div>`:""}</div>`}).join("")+
  `<div class="row" style="margin-top:14px"><button onclick="go('export')">📤 مشاركة محتوى القوائم</button></div>`;
}
function scholar(A){
  const n=view.name,secs=sectionsOf(n),t=stats(n);
  A.innerHTML=`<div class="head"><button onclick="go('home')">→</button><h1>${n}</h1></div>
  <div class="cnt" style="margin-bottom:10px;color:var(--mut)">${t.total?`شاهدت ${t.done} من ${t.total}`:""}</div>
  <div id="player"><div id="yt"></div></div>`+
  (secs.length?secs.map((s,i)=>`<details class="sec" ${i===0?"open":""}><summary>${s.title}<span>${s.videos.filter(v=>{const p=parse(v.url);return p&&watched[p.key]}).length}/${s.videos.length}</span></summary>
    ${s.videos.map(v=>{const p=parse(v.url);if(!p)return"";return `<div class="vid ${watched[p.key]?"done":""} ${cur===p.key?"cur":""}" data-k="${p.key}">
      <button class="chk" onclick="toggle('${p.key}')">✓</button><div class="vt" onclick="play('${p.kind}','${p.id}','${p.key}')">${p.kind==="p"?"📂 ":"▶ "}${v.title}</div>
      ${v.mine?`<button class="del" onclick="delVid('${n}','${p.key}')">🗑</button>`:""}</div>`}).join("")}</details>`).join("")
   :`<div class="empty">لسه مفيش أقسام للشيخ ده.<br>دوس "＋ إضافة" وحط أول فيديو أو قائمة تشغيل.</div>`)+
  `<button class="gold" style="margin-top:8px" onclick="go('add','${n}')">＋ إضافة فيديو لـ ${n}</button>`;
}
function addPage(A){
  const pre=view.name||DATA.scholars[0].name;
  A.innerHTML=`<div class="head"><button onclick="go('home')">→</button><h1>إضافة فيديو</h1></div><div class="card"><form id="f">
  <div><label>الشيخ</label><select id="fs">${DATA.scholars.map(s=>`<option ${s.name===pre?"selected":""}>${s.name}</option>`).join("")}</select></div>
  <div><label>القسم (اكتب اسم جديد أو اختار)</label><input id="fsec" list="secs" placeholder="مثلاً: السيرة النبوية" required></div><datalist id="secs"></datalist>
  <div><label>عنوان الفيديو</label><input id="ft" placeholder="الحلقة الأولى" required></div>
  <div><label>رابط يوتيوب (فيديو أو قائمة تشغيل)</label><input id="fu" dir="ltr" placeholder="https://www.youtube.com/watch?v=..." required></div>
  <button class="gold">حفظ</button></form></div>`;
  const upd=()=>$("#secs").innerHTML=sectionsOf($("#fs").value).map(s=>`<option value="${s.title}">`).join("");
  $("#fs").onchange=upd;upd();
  $("#f").onsubmit=e=>{e.preventDefault();
    if(!parse($("#fu").value))return toast("الرابط مش مفهوم");
    const n=$("#fs").value,sec=$("#fsec").value.trim();
    extras[n]=extras[n]||[];let e2=extras[n].find(x=>x.title===sec);
    if(!e2){e2={title:sec,videos:[]};extras[n].push(e2)}
    e2.videos.push({title:$("#ft").value.trim(),url:$("#fu").value.trim()});
    ls.set("extras",extras);toast("تم الحفظ ✓");go("scholar",n)};
}
function exportPage(A){
  const out=DATA.scholars.map(s=>({name:s.name,sections:sectionsOf(s.name).map(x=>({title:x.title,videos:x.videos.map(({title,url})=>({title,url}))}))}));
  const txt="const DATA = "+JSON.stringify({scholars:out},null,2)+";";
  A.innerHTML=`<div class="head"><button onclick="go('home')">→</button><h1>مشاركة المحتوى</h1></div>
  <div class="card"><p style="line-height:1.9;font-size:14px;color:var(--mut);margin-bottom:10px">انسخ النص ده والصقه في ملف <b>data.js</b> وارفع الموقع تاني، وكل اللي هيفتحه هيشوف نفس الأقسام والفيديوهات.</p>
  <textarea id="tx" readonly>${txt.replace(/</g,"&lt;")}</textarea><button class="gold" style="margin-top:10px" onclick="navigator.clipboard.writeText($('#tx').value).then(()=>toast('اتنسخ ✓'),()=>{$('#tx').select();toast('حدد النص وانسخه')})">نسخ</button></div>`;
}
function go(p,n){view={page:p,name:n};cur=p==="scholar"?cur:null;render();scrollTo(0,0)}
function toggle(k){if(watched[k])delete watched[k];else watched[k]=true;ls.set("watched",watched);const s=window.scrollY;render();scrollTo(0,s);}
function delVid(n,k){extras[n]=(extras[n]||[]).map(s=>({...s,videos:s.videos.filter(v=>{const p=parse(v.url);return !(p&&p.key===k)})})).filter(s=>s.videos.length);ls.set("extras",extras);render()}

/* ===== المشغّل ===== */
function play(kind,id,key){
  cur=key;$("#player").style.display="block";
  document.querySelectorAll(".vid").forEach(e=>e.classList.toggle("cur",e.dataset.k===key));
  scrollTo({top:0,behavior:"smooth"});
  if(!window.YT||!YT.Player)return toast("المشغّل لسه بيتحمّل… جرّب تاني");
  if(player){try{player.destroy()}catch(e){}clearInterval(timer)}
  $("#player").innerHTML='<div id="yt"></div>';
  const opts={width:"100%",height:"100%",playerVars:{rel:0,playsinline:1,autoplay:1},events:{
    onStateChange:e=>{if(e.data===0&&kind==="v")mark(key)}}};
  if(kind==="v")opts.videoId=id;else{opts.playerVars.listType="playlist";opts.playerVars.list=id}
  player=new YT.Player("yt",opts);
  if(kind==="v")timer=setInterval(()=>{try{const d=player.getDuration();if(d>0&&player.getCurrentTime()/d>=0.9)mark(key)}catch(e){}},4000);
}
function mark(key){if(watched[key])return;watched[key]=true;ls.set("watched",watched);toast("تم تسجيله كمشاهَد ✓");
  const el=document.querySelector(`.vid[data-k="${key}"]`);if(el)el.classList.add("done")}
render();
</script>
</body>
</html>
